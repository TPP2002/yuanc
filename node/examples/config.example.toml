# 此文件不保存密码、令牌或密钥；凭据文件由后续授权模块管理。
[node]
# 配置格式版本,升级包要求的最低版本高于它时拒绝升级
config_version = 1
name = "请填写节点名称"
data_dir = "/var/lib/exitnode"
secrets_dir = "/var/lib/exitnode/secrets"
log_level = "INFO"
# 节点所在城市的 IANA 时区名；客户端连上后会把电脑时区切到这里；留空则客户端用自己的本机配置。
time_zone = "Australia/Sydney"
# 节点所在国家的两位大写国家码，用于客户端自检；留空则客户端用自己的本机配置。
country = "AU"

[network]
iface = "auto"
probe_targets = ["1.1.1.1", "8.8.8.8"]

[proxy]
reality_port = 443
hy2_port = 24443
# 两项必须相同;示例给的是澳洲本地大站,装机前由维护人员实测该站支持 TLS 1.3 与 HTTP/2 后确认或更换;不要用微软等与澳洲家庭宽带不相称的站点
sni = "www.abc.net.au"
handshake_server = "www.abc.net.au"
hy2_server_name = "exitnode"
binary = "/usr/bin/sing-box"

[admin]
bind = "127.0.0.1"
port = 8443

[publisher]
mode = "upnp"
ddns_provider = "请填写服务商"
domain = "请填写域名"

[updater]
source = "none"
github_repo = ""
health_timeout_sec = 120
releases_dir = "/opt/exitnode"
channel = "stable"
check_interval = 3600

[watchdog]
enabled = true
restart_limit_per_hour = 3
rollback_min_interval_hours = 6
reboot_enabled = true
reboot_after_minutes = 30
reboot_min_interval_hours = 6
hardware = true
# 仅保留配置项；本版本不会安装每周重启任务。
weekly_reboot = false
restart_after_failures = 4
retry_interval_seconds = 60
max_backoff_seconds = 300

# 分发版才启用；节点密钥不写在这里。
[authsync]
enabled = false
url = ""
spki_sha256 = ""

# 节点管理网页:局域网用 http://<本机局域网地址>:8444/ 打开;隧道里只有本机自用设备能用 http://198.18.255.2/ 打开
[console]
enabled = true
port = 8444
lan = true
