name: 自动检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} 检查
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装检查工具
        run: python -m pip install -r requirements-dev.txt
      - name: 检查代码规范
        run: python -m ruff check node authserver
      - name: 运行测试
        run: python -m pytest -q

  dotnet:
    name: Windows 客户端检查
    runs-on: windows-latest
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
      - name: 准备客户端编译工具
        if: hashFiles('winclient/**/*.sln') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: 运行客户端测试
        if: hashFiles('winclient/**/*.sln') != ''
        run: dotnet test winclient --nologo
