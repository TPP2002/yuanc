[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuanc-authserver"
version = "0.1.0"
description = "邀请码鉴权服务"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "pydantic>=2", "uvicorn>=0.30"]

[project.scripts]
authserver-admin = "authserver.admin_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["authserver*"]
