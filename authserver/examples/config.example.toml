# 所有值均为占位符，必须替换；数字字段替换为不带引号的整数。
[server]
bind = "<监听地址>"
port = "<监听端口>"

[security]
admin_key = "<独立生成的管理员密钥>"
node_key = "<独立生成的节点密钥>"
token_salt = "<独立生成且备份的服务器盐>"

[node]
time_zone = "<节点所在城市的 IANA 时区名,如 Australia/Sydney;留空则客户端用本机配置>"
country = "<两位大写国家码,如 AU;留空则客户端按 AU>"
host = "<节点地址>"
reality_port = "<主通道端口>"
hy2_port = "<备用通道端口>"
reality_public_key = "<Reality公钥>"
short_id = "<十六进制短标识>"
sni = "<服务端证书与Reality使用的域名>"
hy2_server_name = "exitnode"
hy2_certificate_path = "<节点备用通道证书的本地文件路径，不是私钥>"
hy2_obfs_password_path = "<节点 /var/lib/exitnode/secrets/hy2.obfs 的本地副本路径>"

[limits]
session_hours = "<会话小时数，默认6>"
default_device_limit = "<设备上限，默认2>"
redeem_per_ip_per_hour = "<每个IP每小时兑换次数上限,默认10>"
session_per_ip_per_hour = "<每个IP每小时取会话次数上限,默认120>"
